<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SRTF Scheduler</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>SRTF Scheduler (Shortest Remaining Time First)</h1>
    <table id="processTable">
      <thead>
        <tr>
          <th>Process ID</th>
          <th>Arrival Time</th>
          <th>Burst Time</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr>
          <td>P1</td>
          <td><input type="number" value="0" /></td>
          <td><input type="number" value="8" /></td>
        </tr>
      </tbody>
    </table>
    <button onclick="addProcess()">Add Process</button>
    <button onclick="runSRTF()">Run</button>

    <h2>Gantt Chart</h2>
    <div id="ganttChart"></div>

    <h2>Results</h2>
    <table>
      <thead>
        <tr>
          <th>Process</th>
          <th>Waiting Time</th>
          <th>Turnaround Time</th>
        </tr>
      </thead>
      <tbody id="resultBody"></tbody>
    </table>
  </div>

  <script src="script.js"></script>
</body>
</html>
