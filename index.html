<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SRTF Scheduler</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
  <h2>SRTF Scheduler (Shortest Remaining Time First)</h2>

  <form id="schedulerForm">
    <table id="processTable">
      <tr><th>Process ID</th><th>Arrival Time</th><th>Burst Time</th></tr>
      <tr>
        <td>P1</td>
        <td><input type="number" name="arrival" required></td>
        <td><input type="number" name="burst" required></td>
      </tr>
    </table>
    <button type="button" onclick="addRow()">Add Process</button>
    <button type="submit">Run</button>
  </form>

  <div id="ganttChart" class="hidden">
    <h3>Gantt Chart</h3>
    <div id="chartContainer"></div>
  </div>

  <div id="results" class="hidden">
    <h3>Results</h3>
    <table id="resultTable">
      <tr><th>Process</th><th>Waiting Time</th><th>Turnaround Time</th></tr>
    </table>
  </div>

  <script src="script.js"></script>
  </div>
</body>
</html>
